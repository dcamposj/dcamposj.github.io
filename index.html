<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title-tag">Diego Francisco Campos Jimenez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="bg-slate-950 text-white min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <!-- Hero Section -->
        <header class="text-center mb-16">
            <h1 class="text-5xl md:text-7xl font-bold mb-4 py-4 bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 bg-clip-text text-transparent animate-gradient">
                Diego Francisco Campos Jimenez
            </h1>
            <p class="text-xl md:text-2xl text-slate-300 mb-8 tracking-wide">
                Front End Developer & UI/UX Designer
            </p>
            <button id="email-button"
                class="group relative px-8 py-4 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-full font-semibold overflow-hidden transition-all duration-300 hover:shadow-lg hover:shadow-cyan-500/25 hover:scale-105">
                <span class="relative z-10 flex items-center gap-2">
                    <i data-lucide="mail" class="w-5 h-5"></i>
                    Contact Me
                </span>
                <div class="absolute inset-0 bg-gradient-to-r from-purple-600 to-pink-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </button>
            <button id="linkedin-button"
                class="group relative px-8 py-4 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-full font-semibold overflow-hidden transition-all duration-300 hover:shadow-lg hover:shadow-cyan-500/25 hover:scale-105">
                <span class="relative z-10 flex items-center gap-2" translate="no">
                    <i data-lucide="circle-user" class="w-5 h-5"></i>
                    LinkedIn
                </span>
                <div class="absolute inset-0 bg-gradient-to-r from-purple-600 to-pink-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </button>
            <button id="github-button"
                class="group relative px-8 py-4 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-full font-semibold overflow-hidden transition-all duration-300 hover:shadow-lg hover:shadow-cyan-500/25 hover:scale-105">
                <span class="relative z-10 flex items-center gap-2" translate="no">
                    <i data-lucide="folder-git" class="w-5 h-5"></i>
                    GitHub
                </span>
                <div class="absolute inset-0 bg-gradient-to-r from-purple-600 to-pink-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </button>
        </header>

        <!-- Projects Grid -->
        <section class="max-w-7xl mx-auto">
            <h2 class="text-3xl md:text-4xl font-bold text-center mb-12 text-slate-200">
                <span class="bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">Portfolio</span>
            </h2>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </section>
    </div>
    <script src="scripts/app.js"></script>
</body>

</html>
