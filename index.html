<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title-tag">Diego Francisco Campos Jimenez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="bg-gray-900 text-white min-h-screen">
    <h1 class="text-3xl mt-0">Portfolio</h1>
    <h1 class="text-3xl font-bold mt-0">Diego Francisco Campos Jimenez</h1>
    <h3 class="text-xl mt-0">Front End Developer & UI/UX Designer</h2>
        <button id="email-button"
            class="action-button bg-blue-500 text-white hover:bg-blue-600 w-[160px] h-[50px] flex items-center justify-center rounded-lg">
            <i data-lucide="mail" class="icon-mail" aria-hidden="true"></i>
            <span class="text-l font-bold ml-2">Contact Me</span>
        </button>
        <div class="container mx-auto px-4 py-6 md:py-10 flex flex-col justify-start">
            <div class="max-w-5xl mx-auto w-full">

                <div class="bg-white rounded-xl shadow-xl overflow-hidden p-6 md:p-10 gallery-card relative">
                    <div id="project-display" class="text-center">
                        <h2 id="project-title" class="text-3xl font-bold mb-6 text-gray-800 uppercase tracking-wider">
                            Cargando...
                        </h2>

                        <a id="project-link" href="#" target="_blank"
                            class="block rounded-lg overflow-hidden group relative h-[45vh] md:h-[60vh] w-full">

                            <img id="project-image" src="" alt="Preview"
                                class="hover:scale-[1.02] transition-transform duration-300">

                            <div
                                class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                <span class="text-white text-xl font-bold bg-blue-600 px-6 py-2 rounded-full shadow-lg">
                                    Go to Project
                                </span>
                            </div>
                        </a>
                    </div>

                    <div class="flex justify-between mt-8">
                        <button id="prev-btn"
                            class="nav-button px-6 py-3 rounded-lg bg-gray-600 text-white hover:bg-gray-700 transition font-medium">
                            &larr; <span id="prev-text" class="hidden sm:inline">Previous</span>
                        </button>
                        <button id="next-btn"
                            class="nav-button px-6 py-3 rounded-lg bg-blue-500 text-white hover:bg-blue-600 transition font-medium">
                            <span id="next-text" class="hidden sm:inline">Next</span> &rarr;
                        </button>
                    </div>
                </div>
                <script src="scripts/app.js"></script>
            </div>
        </div>
</body>

</html>
