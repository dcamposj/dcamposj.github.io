<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title-tag">Diego Francisco Campos Jimenez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <div id="preview-screen">
        <div id="parallax-image"></div>
    </div>

    <div class="container mx-auto px-4 py-8 md:py-12 min-h-screen flex flex-col justify-center">

        <div class="flex justify-end mb-4 md:mb-8 max-w-xl mx-auto w-full">
             <button id="lang-toggle" class="action-button bg-gray-700 text-gray-200 hover:bg-gray-600 px-3 py-2 text-sm">
                <i data-lucide="globe" class="w-4 h-4 mr-2"></i> 
                <span id="lang-text">English</span>
            </button>
        </div>
        
        <div class="max-w-xl mx-auto w-full">
            <header class="text-center mb-8 md:mb-10">
                <h1 id="header-title" class="text-4xl sm:text-5xl font-extrabold text-blue-400 mb-2">Galería Parallax</h1>
                <p id="header-subtitle" class="text-sm md:text-lg text-gray-400">
                    Explora las previsualizaciones. Mueve el ratón para el efecto Parallax.
                </p>
            </header>

            <div id="slide-display" class="content-card p-6 md:p-10 rounded-xl shadow-2xl border border-blue-400/50 flex flex-col items-center text-center space-y-4">
                <h2 id="slide-title" class="text-2xl sm:text-3xl font-bold text-white transition duration-500 ease-in-out"></h2>
                <p id="slide-url" class="text-sm md:text-lg text-blue-300 font-mono transition duration-500 ease-in-out break-all"></p>
                <a id="slide-link" target="_blank" class="nav-button bg-blue-500 text-white hover:bg-blue-600">
                    <span id="link-text">Ir al Enlace</span> &rarr;
                </a>
            </div>

            <!-- Controles de Navegación -->
            <div class="flex justify-between mt-6 md:mt-8">
                <button id="prev-btn" class="nav-button bg-gray-600 text-white hover:bg-gray-700">
                    &larr; <span id="prev-text">Anterior</span>
                </button>
                <button id="next-btn" class="nav-button bg-blue-500 text-white hover:bg-blue-600">
                    <span id="next-text">Siguiente</span> &rarr;
                </button>
            </div>
            
            <p id="slide-counter" class="text-center mt-4 text-gray-400 font-semibold text-sm"></p>
        </div>

        <footer class="text-center mt-8 md:mt-12 text-gray-500 text-xs md:text-sm">
            <p id="footer-text">Efecto de galería con imágenes simuladas y Parallax dinámico.</p>
        </footer>
    </div>
    <script src="scripts/app.js"></script>
</body>
</html>
